<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Work Updates India</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#f7f3ff);
  color:#172033;
}
.card{
  width:min(92%,430px); background:#fff; border-radius:24px; padding:30px 24px;
  text-align:center; box-shadow:0 12px 35px rgba(0,0,0,.12);
}
.logo{
  width:82px;height:82px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
  background:#229ed9;color:white;font-size:38px;font-weight:700;
}
h1{font-size:27px;margin:8px 0 10px}
p{font-size:16px;line-height:1.55;color:#5d6678;margin:0 0 24px}
.btn{
  display:block;text-decoration:none;background:#229ed9;color:#fff;
  padding:16px 20px;border-radius:13px;font-size:18px;font-weight:700;
  transition:.2s;
}
.btn:hover{transform:translateY(-1px);filter:brightness(.96)}
.note{font-size:12px;color:#8992a3;margin-top:16px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">✈</div>
  <h1>Online Work Updates India</h1>
  <p>Online work aur useful updates paane ke liye hamare Telegram channel se juden.</p>
  <a class="btn" href="https://t.me/+4SdvrzKwk301N2I1" target="_blank" rel="noopener noreferrer">
    Join Telegram
  </a>
  <div class="note">Telegram par join karne ke liye button par tap karein.</div>
</main>
</body>
</html>
